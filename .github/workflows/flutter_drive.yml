name: integration test

on:
  push:
    branches:
    - vespr/9.x
  pull_request:
defaults:
  run:
    shell: bash
env:
  PUB_ENVIRONMENT: bot.github

jobs:
  drive_android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # API 26 is the VESPR app's minSdk (Flutter 3.47 also no longer supports 32-bit x86 Android).
          - api-level: 26
            target: default
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64
      fail-fast: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          preinstalled-runtimes: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          echo "$HOME/AppData/Local/Pub/Cache/bin" >> "$GITHUB_PATH"
      - name: Initialize workspace through melos
        run: melos bootstrap
      # Do the heavy first Gradle/NDK build before the emulator boots, so it doesn't compete with it for CPU.
      - name: Build example APK
        working-directory: flutter_secure_storage/example
        run: flutter build apk --debug
      - name: Run Flutter Integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          # Target the emulator explicitly so the test never falls back to the Linux desktop device.
          # Cap the run so a hung install/launch fails with logs instead of hitting the job timeout.
          # On failure, print the relevant logcat lines (plugin/keystore/install errors) to aid debugging.
          script: |
            adb logcat -c || true
            timeout 600 flutter test integration_test -d emulator-5554 || { adb logcat -d -v time | grep -iE 'flutter|securestorage|sharedpref|keystore|tink|crypto|AndroidRuntime|FATAL|PackageManager|installd|dex2oat' | tail -n 400; exit 1; }
          working-directory: flutter_secure_storage/example
  drive_ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # This fork's iOS integration test only runs on the 3.51 beta: Flutter 3.50 stable can launch the app
      # before the simulator `log stream` is ready and never see the VM service URL (flutter/flutter#181771,
      # fixed by flutter/flutter#193142 in 3.51). Go back to stable once a 3.51 stable is out.
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: 3.51.0-0.2.pre
      - name: Install melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          echo "$HOME/AppData/Local/Pub/Cache/bin" >> "$GITHUB_PATH"
      - name: Initialize workspace through melos
        run: melos bootstrap
      # Run the project migrations (SPM, deployment target) and the first Xcode build before the
      # simulator boots, so the test step only does an incremental build on an idle machine.
      - name: Build example iOS app
        working-directory: flutter_secure_storage/example
        run: flutter build ios --simulator --debug
      - uses: futureware-tech/simulator-action@v6
        id: simulator
        with:
          os: iOS
          os_version: ">=18.1"
          model: "iPhone 17"
      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus ${{ steps.simulator.outputs.udid }} -b
      - name: Run Flutter Integration tests
        working-directory: flutter_secure_storage/example
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        # Target the simulator explicitly so the test never falls back to the macOS desktop device.
        # Cap the run at 12 min so a hung install/launch fails with logs instead of hitting the job timeout
        # (macOS has no `timeout`, so perl runs the test in its own process group and kills that).
        # On failure, print the simulator's log lines for the app and app installs.
        run: |
          perl -e '$t = shift; $p = fork; if (!$p) { setpgrp; exec @ARGV or die "exec: $!" }
            $SIG{ALRM} = sub { print STDERR "Timed out after ${t}s\n"; kill "TERM", -$p; sleep 10; kill "KILL", -$p; exit 124 };
            alarm $t; waitpid $p, 0; exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' \
            720 flutter test integration_test -d "$UDID" || {
            xcrun simctl spawn "$UDID" log show --last 20m --style compact \
              --predicate 'process == "Runner" OR process == "installcoordinationd" OR process == "installd" OR eventMessage CONTAINS "com.itnomads.example"' \
              | tail -n 400 || true
            exit 1
          }
