name: code analysis & formatting

on:
  - push
  - pull_request
defaults:
  run:
    shell: bash
env:
  PUB_ENVIRONMENT: bot.github

jobs:
  analysis_and_formatting:
    name: Analysis & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.47.x
      - name: Version
        run: flutter doctor -v
      - name: Install melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          echo "$HOME/AppData/Local/Pub/Cache/bin" >> $GITHUB_PATH
      - name: Initialize workspace through melos
        run: melos bootstrap
      # Info-level lints are non-fatal (pre-existing in untouched packages); warnings and errors stay fatal.
      # `melos analyze` has no `--no-fatal-infos` flag, so call `flutter analyze` directly in each package.
      - name: Linter
        run: melos exec -c 1 -- flutter analyze --no-fatal-infos
      - name: Format
        run: melos format --output none --set-exit-if-changed

  windows_unit_tests:
    name: Windows unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.47.x
      # The pub cache bin dir is not on PATH on Windows runners, so run melos through pub.
      - name: Install melos
        run: flutter pub global activate melos
      - name: Initialize workspace through melos
        run: flutter pub global run melos bootstrap
      - name: Run unit tests
        working-directory: flutter_secure_storage_windows
        run: flutter test
