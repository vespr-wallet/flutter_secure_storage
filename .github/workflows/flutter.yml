name: code analysis & formatting

on:
  - push
  - pull_request
defaults:
  run:
    shell: bash
env:
  PUB_ENVIRONMENT: bot.github

jobs:
  analysis_and_formatting:
    name: Analysis & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.50.0
      - name: Version
        run: flutter doctor -v
      - name: Install melos
        run: |
          flutter pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          echo "$HOME/AppData/Local/Pub/Cache/bin" >> "$GITHUB_PATH"
      - name: Initialize workspace through melos
        run: melos bootstrap
      # Infos, warnings and errors are all fatal (flutter analyze's default).
      - name: Linter
        run: melos exec -c 1 -- flutter analyze
      - name: Format
        run: melos format --output none --set-exit-if-changed
